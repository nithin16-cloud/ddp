<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabLine — Cryptographic Report Verification Portal</title>

  <!-- Anti-FOUC Theme Script: must execute before body renders -->
  <script>
    (function() {
      const saved = localStorage.getItem('labline_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <!-- Favicon Suite -->
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/tailwind.config.js"></script>
</head>
<body class="bg-[var(--bg-app)] text-[var(--text-primary)] font-body min-h-[100dvh] flex flex-col antialiased selection:bg-[var(--accent)] selection:text-white">

  <!-- NAVBAR -->
  <header class="glass-header sticky top-0 z-40 bg-[var(--surface-blur)] border-b border-[var(--border)] backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="catalog.html" class="flex items-center gap-2.5">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="30" height="30" fill="none" class="labline-logo-mark" aria-hidden="true">
            <ellipse cx="24" cy="42" rx="14" ry="2.2" fill="var(--logo-shadow, rgba(15, 23, 42, 0.08))" />
            <path d="M20 27H37C38.6569 27 40 28.3431 40 30V35C40 36.1046 39.1046 37 38 37H20V27Z" fill="var(--logo-dark, #0f766e)" />
            <path d="M10 14L20 21V37H12C10.8954 37 10 36.1046 10 35V14Z" fill="var(--logo-mid, #0d9488)" />
            <path d="M20 21L31 13V27H20V21Z" fill="var(--logo-dark, #0f766e)" opacity="0.55" />
            <path d="M20 5L31 13L20 21L9 13L20 5Z" fill="var(--logo-light, #2dd4bf)" />
            <circle cx="35" cy="32" r="2.2" fill="var(--surface, #ffffff)" />
            <circle cx="35" cy="32" r="1.1" fill="var(--logo-dark, #0f766e)" />
          </svg>
          <div>
            <span class="font-bold text-base text-[var(--text-primary)] leading-tight block">LabLine</span>
            <span class="text-[10px] font-mono uppercase text-[var(--accent)] font-semibold block">Public Verification Seal</span>
          </div>
        </a>
      </div>

      <!-- Navigation Tabs -->
      <nav class="hidden md:flex items-center gap-1 bg-[var(--surface-subtle)] p-1 rounded-lg text-xs font-semibold text-[var(--text-secondary)] border border-[var(--border)]">
        <a href="catalog.html" class="px-3.5 py-1.5 rounded-md hover:text-[var(--text-primary)] font-medium transition-all">Test Catalog</a>
        <a href="reports.html" class="px-3.5 py-1.5 rounded-md hover:text-[var(--text-primary)] font-medium transition-all">Lab Reports</a>
        <a href="verify.html" class="px-3.5 py-1.5 rounded-md bg-[var(--surface)] text-[var(--accent)] font-bold shadow-xs">Report Authenticator</a>
      </nav>

      <div class="flex items-center gap-3">
        <!-- Theme Toggle -->
        <button onclick="window.toggleTheme && window.toggleTheme()" class="theme-toggle-btn" title="Toggle theme" aria-label="Toggle light and dark mode">
          <svg class="sun-icon w-4 h-4 text-[var(--accent)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
          <svg class="moon-icon w-4 h-4 text-[var(--accent)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>

        <a href="reports.html" class="app-btn app-btn-outline text-xs">
          Back to Reports
        </a>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-10 flex-1 w-full space-y-6">

    <!-- SEARCH HERO -->
    <div class="text-center space-y-2">
      <span class="badge-status badge-info">
        SHA-256 Cryptographic Seal
      </span>
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-[var(--text-primary)]">Diagnostic Report Authenticator</h1>
      <p class="text-xs sm:text-sm text-[var(--text-secondary)] max-w-lg mx-auto">
        Verify the cryptographic integrity of any diagnostic report issued by LabLine. Scanned via QR code or entered by order accession number.
      </p>
    </div>

    <!-- SEARCH BAR -->
    <div class="clinical-card p-2 sm:p-2.5 flex items-center gap-2">
      <div class="relative flex-1">
        <input 
          type="text" 
          id="verify-input-id" 
          placeholder="Enter Order Accession ID (e.g. LL-2026-8941)" 
          class="app-input w-full pl-9 pr-3 py-2 text-xs font-mono font-bold uppercase placeholder:normal-case placeholder:font-sans"
        />
        <svg class="w-4 h-4 text-[var(--text-muted)] absolute left-3 top-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
      <button onclick="performVerification()" class="app-btn app-btn-primary px-5 py-2 text-xs font-bold shrink-0">
        Verify Report
      </button>
    </div>

    <!-- VERIFICATION RESULT CARD -->
    <div id="verify-result-container" class="space-y-4">
      <!-- Injected by JavaScript -->
    </div>

  </main>

  <!-- Notification Container for Floating Toasts -->
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script src="../js/shared.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const queryId = urlParams.get('id') || LabStore.getActiveOrderId() || '';
      if (queryId) {
        document.getElementById('verify-input-id').value = queryId;
        performVerification();
      }
    });

    async function performVerification() {
      const inputId = document.getElementById('verify-input-id').value.trim();
      const container = document.getElementById('verify-result-container');

      if (!inputId) {
        showToast('Please enter a valid Order ID', 'error');
        return;
      }

      let verification = null;
      let order = null;

      try {
        verification = await LabStore.verifyReport(inputId);
      } catch (e) {
        console.warn('Backend verify API returned error, checking local fallback:', e.message);
      }

      if (!verification) {
        try {
          order = await LabStore.getOrderById(inputId);
        } catch (e) {
          order = null;
        }
        if (!order) {
          container.innerHTML = `
            <div class="clinical-card p-8 text-center space-y-3 border border-[var(--color-danger)] bg-[var(--surface-subtle)]">
              <div class="w-10 h-10 mx-auto rounded-full bg-[var(--color-danger-bg)] text-[var(--color-danger-text)] flex items-center justify-center font-bold">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
              </div>
              <h3 class="text-base font-bold text-[var(--text-primary)]">Record Not Found</h3>
              <p class="text-xs text-[var(--text-secondary)] max-w-md mx-auto">
                No diagnostic report matches accession code <strong class="text-[var(--text-primary)] font-mono">${inputId}</strong>. This document may be invalid or uncertified.
              </p>
            </div>
          `;
          return;
        }
      }

      const isAuthentic = verification ? verification.is_authentic : (order.isCertified && Boolean(order.reportHash));
      const patientName = verification ? verification.patient_name : order.patientName;
      const certifiedHash = verification ? verification.sha256_hash : (order.reportHash || 'Pending Certification');
      const certifiedDate = verification ? (verification.certified_at || 'Certified by Pathologist') : (order.certifiedAt || 'Certified');
      const testList = verification ? (verification.tests || []) : (order.testNames || []);
      const barcode = order ? (order.sampleTubeBarcode || 'BC-VERIFIED') : `BC-${inputId.replace('ORD-', '')}`;

      container.innerHTML = `
        <div class="clinical-card p-6 sm:p-8 space-y-6 border ${isAuthentic ? 'border-[var(--color-success)]' : 'border-[var(--color-danger)]'}">
          
          <!-- Top Badge & Watermark -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-5 border-b border-[var(--border)]">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-lg ${isAuthentic ? 'bg-[var(--color-success-bg)] text-[var(--color-success-text)]' : 'bg-[var(--color-danger-bg)] text-[var(--color-danger-text)]'} flex items-center justify-center font-bold shrink-0">
                ${isAuthentic 
                  ? '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>' 
                  : '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>'}
              </div>
              <div>
                <span class="text-[10px] font-mono uppercase font-bold tracking-wider ${isAuthentic ? 'text-[var(--color-success-text)]' : 'text-[var(--color-danger-text)]'} block">
                  ${isAuthentic ? 'OFFICIAL VERIFICATION PASS' : 'INTEGRITY MISMATCH WARNING'}
                </span>
                <h2 class="font-bold text-lg text-[var(--text-primary)] mt-0.5">
                  ${isAuthentic ? 'Authentic Certified Report' : 'Altered or Modified Report'}
                </h2>
              </div>
            </div>

            <div class="text-left sm:text-right font-mono text-xs text-[var(--text-muted)]">
              <span class="block text-[10px] uppercase font-bold">Verification Timestamp</span>
              <span class="text-[var(--text-primary)] font-semibold">${new Date().toLocaleString()}</span>
            </div>
          </div>

          <!-- Demographics Grid -->
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 p-4 rounded-lg bg-[var(--surface-subtle)] border border-[var(--border)] text-xs">
            <div>
              <span class="text-[10px] font-mono text-[var(--text-muted)] block uppercase font-medium">Order ID</span>
              <strong class="text-[var(--text-primary)] font-mono">${inputId}</strong>
            </div>
            <div>
              <span class="text-[10px] font-mono text-[var(--text-muted)] block uppercase font-medium">Patient Legal Name</span>
              <strong class="text-[var(--text-primary)]">${patientName}</strong>
            </div>
            <div>
              <span class="text-[10px] font-mono text-[var(--text-muted)] block uppercase font-medium">Tube Barcode</span>
              <strong class="text-[var(--text-primary)] font-mono">${barcode}</strong>
            </div>
            <div>
              <span class="text-[10px] font-mono text-[var(--text-muted)] block uppercase font-medium">Certified Date</span>
              <strong class="text-[var(--accent)] font-mono font-semibold">${certifiedDate}</strong>
            </div>
          </div>

          <!-- Cryptographic Hash Box -->
          <div class="p-4 rounded-lg bg-[var(--surface-subtle)] border border-[var(--border)] space-y-2 text-xs font-mono">
            <div class="flex items-center justify-between text-[11px]">
              <span class="text-[var(--accent)] font-bold">SHA-256 Cryptographic Signature</span>
              <span class="text-[10px] text-[var(--text-muted)] font-sans">Canonical 256-bit Digest</span>
            </div>
            <div class="p-2.5 rounded-md bg-[var(--surface)] border border-[var(--border)] text-[var(--text-primary)] font-mono font-semibold select-all break-all text-[11px]">
              ${certifiedHash}
            </div>
            <p class="text-[10px] text-[var(--text-muted)] font-sans">
              Generated by SHA-256 hash algorithm over canonical patient demographic and numerical biomarker tuples.
            </p>
          </div>

          <!-- Panels Included -->
          <div class="space-y-2 text-xs">
            <h4 class="font-bold text-[var(--text-primary)] text-xs uppercase tracking-wide">Included Clinical Investigation Panels</h4>
            <div class="flex flex-wrap gap-2">
              ${testList.map(t => `<span class="px-3 py-1 rounded-md bg-[var(--surface-subtle)] border border-[var(--border)] text-[var(--text-secondary)] font-semibold">${t}</span>`).join('')}
            </div>
          </div>

          <!-- Medical Authority & Sign-Off -->
          <div class="pt-4 border-t border-[var(--border)] flex flex-col sm:flex-row items-center justify-between gap-4 text-xs font-mono">
            <div class="space-y-0.5 text-center sm:text-left">
              <span class="text-[10px] text-[var(--text-muted)] block uppercase font-medium">Certifying Pathologist</span>
              <strong class="text-[var(--text-primary)] block font-body">Dr. Yatish Rao, MD, DNB</strong>
              <span class="text-[10px] text-[var(--text-muted)] font-sans">Lead Consultant Pathologist · Reg: KMC-8841</span>
            </div>
            <div class="space-y-0.5 text-center sm:text-right">
              <span class="text-[10px] text-[var(--text-muted)] block uppercase font-medium">Laboratory Authority</span>
              <strong class="text-[var(--accent)] block font-body">Clinical Pathology &amp; Diagnostic Biochemistry</strong>
              <span class="text-[10px] text-[var(--text-muted)] font-sans">LabLine Diagnostics Central Laboratory</span>
            </div>
          </div>

        </div>
      `;
    }
  </script>
</body>
</html>
