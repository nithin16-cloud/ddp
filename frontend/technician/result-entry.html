<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LabLine — Result Entry</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg:#F5F7F7; --ink:#12232E; --teal:#0E8478; --teal-light:#39A99C;
    --amber:#D98A2B; --red:#C24A3F; --line:#D7DEDE; --paper-tint:#EDF2F1;
  }
  *{box-sizing:border-box;}
  body{ background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; }
  .font-display{font-family:'Space Grotesk',sans-serif;}
  .font-mono{font-family:'IBM Plex Mono',monospace;}
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }

  .field-input, .field-select{ border:1px solid var(--line); background:#fff; }
  .field-input:focus, .field-select:focus{ border-color:var(--teal); }

  .param-row{ border-bottom:1px solid var(--line); }
  .param-row:last-child{ border-bottom:none; }

  .flag{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.03em;
    padding:2px 8px;
    border-radius:999px;
    white-space:nowrap;
  }
  .flag-normal{ background:var(--paper-tint); color:var(--teal); }
  .flag-high{ background:#FBEDE4; color:var(--amber); }
  .flag-low{ background:#EFF1FB; color:#5B5FC7; }
  .flag-abnormal{ background:#FBEAE8; color:var(--red); }
  .flag-pending{ background:#F1F3F3; color:#94A3A8; }

  .test-section{ border:1px solid var(--line); background:#fff; }
</style>
</head>
<body class="min-h-screen">

<header class="border-b border-slate-200 bg-white sticky top-0 z-20">
  <div class="max-w-3xl mx-auto px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <svg width="20" height="20" viewBox="0 0 22 22" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="20" height="20" rx="4" stroke="#0E8478" stroke-width="1.6"/>
        <path d="M6 11h3l1.5-4 2 8 1.5-4h3" stroke="#0E8478" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="font-display font-semibold">LabLine</span>
      <span class="font-mono text-[10px] text-slate-400 ml-1 border border-slate-200 rounded px-1.5 py-0.5">TECHNICIAN</span>
    </div>
    <nav class="hidden sm:flex items-center gap-6 text-sm text-slate-500">
      <a href="queue.html" class="hover:text-slate-800">← Back to queue</a>
      <a href="../index.html" class="hover:text-slate-800">Sign out</a>
    </nav>
  </div>
</header>

<main class="max-w-3xl mx-auto px-6 py-10">

  <div id="entry-state">
    <p class="font-mono text-xs text-slate-400 mb-1" id="sample-id-label">—</p>
    <h1 class="font-display font-semibold text-2xl mb-1">Enter test results</h1>
    <p class="text-sm text-slate-500 mb-8">Values are flagged automatically against the reference range as you type.</p>

    <div id="test-sections" class="space-y-6"></div>

    <button id="generate-btn" disabled
      class="w-full sm:w-auto rounded-md px-5 py-2.5 text-sm font-medium text-white mt-8 disabled:opacity-40 disabled:cursor-not-allowed"
      style="background:var(--ink)">
      Generate report
    </button>
    <p class="font-mono text-[11px] text-slate-400 mt-3">
      FILL EVERY FIELD TO ENABLE REPORT GENERATION
    </p>
  </div>

  <div id="done-state" class="hidden text-center py-16">
    <h1 class="font-display font-semibold text-2xl mb-2">Report generated</h1>
    <p class="text-sm text-slate-500 mb-8">The compiled PDF has been added to the patient's dashboard.</p>
    <a href="queue.html" class="inline-block rounded-md px-5 py-2.5 text-sm font-medium text-white" style="background:var(--ink)">
      Back to queue
    </a>
  </div>

</main>

<script>
  // Reference ranges per test — in the real app these come from the backend catalog.
  const TEST_PARAMS = {
    cbc: { name:'Complete Blood Count (CBC)', params:[
      { key:'hb',  label:'Hemoglobin', unit:'g/dL',  type:'numeric', min:13,   max:17 },
      { key:'wbc', label:'WBC Count',  unit:'/µL',   type:'numeric', min:4000, max:11000 },
      { key:'plt', label:'Platelet Count', unit:'lakh/µL', type:'numeric', min:1.5, max:4.5 },
    ]},
    lipid: { name:'Lipid Profile', params:[
      { key:'chol', label:'Total Cholesterol', unit:'mg/dL', type:'numeric', min:125, max:200 },
      { key:'ldl',  label:'LDL', unit:'mg/dL', type:'numeric', min:0, max:100 },
      { key:'hdl',  label:'HDL', unit:'mg/dL', type:'numeric', min:40, max:60 },
      { key:'trig', label:'Triglycerides', unit:'mg/dL', type:'numeric', min:0, max:150 },
    ]},
    tsh: { name:'Thyroid Panel', params:[
      { key:'tsh', label:'TSH', unit:'µIU/mL', type:'numeric', min:0.4, max:4.0 },
    ]},
    hba1c: { name:'HbA1c', params:[
      { key:'hba1c', label:'HbA1c', unit:'%', type:'numeric', min:4, max:5.6 },
    ]},
    vitd: { name:'Vitamin D Total', params:[
      { key:'vitd', label:'Vitamin D', unit:'ng/mL', type:'numeric', min:30, max:100 },
    ]},
    lft: { name:'Liver Function Test', params:[
      { key:'sgot', label:'SGOT/AST', unit:'U/L', type:'numeric', min:5, max:40 },
      { key:'sgpt', label:'SGPT/ALT', unit:'U/L', type:'numeric', min:7, max:56 },
      { key:'bili', label:'Bilirubin', unit:'mg/dL', type:'numeric', min:0.1, max:1.2 },
    ]},
    kft: { name:'Kidney Function Test', params:[
      { key:'creat', label:'Creatinine', unit:'mg/dL', type:'numeric', min:0.6, max:1.3 },
      { key:'urea',  label:'Urea', unit:'mg/dL', type:'numeric', min:7, max:20 },
    ]},
    covid: { name:'COVID-19 RT-PCR', params:[
      { key:'result', label:'Result', type:'select', options:['Negative','Positive'], abnormal:['Positive'] },
    ]},
    urine: { name:'Urine Routine & Microscopy', params:[
      { key:'protein', label:'Protein', type:'select', options:['Negative','Trace','Positive'], abnormal:['Trace','Positive'] },
      { key:'sugar',   label:'Sugar', type:'select', options:['Negative','Positive'], abnormal:['Positive'] },
    ]},
  };

  const urlParams = new URLSearchParams(window.location.search);
  const sampleId = urlParams.get('id') || 'UNKNOWN';
  const testIds = (urlParams.get('tests') || '').split(',').filter(Boolean);
  const isLive = urlParams.get('live') === '1';

  document.getElementById('sample-id-label').textContent = sampleId;

  const values = {}; // key -> value

  function flagFor(param, rawValue){
    if (rawValue === '' || rawValue === undefined) return { text:'PENDING', cls:'flag-pending' };

    if (param.type === 'numeric'){
      const v = parseFloat(rawValue);
      if (isNaN(v)) return { text:'PENDING', cls:'flag-pending' };
      if (v < param.min) return { text:'LOW', cls:'flag-low' };
      if (v > param.max) return { text:'HIGH', cls:'flag-high' };
      return { text:'NORMAL', cls:'flag-normal' };
    }

    if (param.type === 'select'){
      return param.abnormal.includes(rawValue)
        ? { text:'ABNORMAL', cls:'flag-abnormal' }
        : { text:'NORMAL', cls:'flag-normal' };
    }
  }

  function renderSections(){
    const container = document.getElementById('test-sections');
    container.innerHTML = testIds.map(testId => {
      const test = TEST_PARAMS[testId];
      if (!test) return '';

      return `
        <div class="test-section rounded-lg p-5">
          <p class="font-medium text-sm mb-4">${test.name}</p>
          ${test.params.map(p => `
            <div class="param-row py-3 flex items-center justify-between gap-4">
              <div class="flex-1">
                <label for="${p.key}" class="block text-sm">${p.label}${p.unit ? ` <span class="text-slate-400 font-mono text-xs">(${p.unit})</span>` : ''}</label>
                ${p.type === 'numeric' ? `<p class="font-mono text-[11px] text-slate-400">Reference: ${p.min}–${p.max}</p>` : ''}
              </div>
              <div class="flex items-center gap-3 flex-none">
                ${p.type === 'numeric'
                  ? `<input id="${p.key}" data-key="${p.key}" type="number" step="any" class="field-input rounded-md px-3 py-1.5 text-sm w-28 outline-none" placeholder="Value" />`
                  : `<select id="${p.key}" data-key="${p.key}" class="field-select rounded-md px-3 py-1.5 text-sm outline-none">
                       <option value="" disabled selected>Select</option>
                       ${p.options.map(o => `<option value="${o}">${o}</option>`).join('')}
                     </select>`
                }
                <span id="flag-${p.key}" class="flag flag-pending">PENDING</span>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }).join('');

    // Wire up live flagging
    testIds.forEach(testId => {
      const test = TEST_PARAMS[testId];
      if (!test) return;
      test.params.forEach(p => {
        const el = document.getElementById(p.key);
        el.addEventListener('input', () => {
          values[p.key] = el.value;
          const flag = flagFor(p, el.value);
          const flagEl = document.getElementById(`flag-${p.key}`);
          flagEl.textContent = flag.text;
          flagEl.className = `flag ${flag.cls}`;
          checkComplete();
        });
      });
    });
  }

  function checkComplete(){
    const allKeys = testIds.flatMap(t => (TEST_PARAMS[t]?.params || []).map(p => p.key));
    const allFilled = allKeys.every(k => values[k] !== undefined && values[k] !== '');
    document.getElementById('generate-btn').disabled = !allFilled;
  }

  document.getElementById('generate-btn').addEventListener('click', () => {
    document.getElementById('entry-state').classList.add('hidden');
    document.getElementById('done-state').classList.remove('hidden');

    // If this was the live demo sample, move it to the final stage so the
    // patient's tracking/reports screens reflect a completed report.
    if (isLive){
      const active = JSON.parse(localStorage.getItem('labline_active_sample') || 'null');
      if (active){
        active.stage = 5;
        active.updatedAt = new Date().toISOString();
        active.results = values;
        localStorage.setItem('labline_active_sample', JSON.stringify(active));
      }
    }
  });

  renderSections();
</script>

</body>
</html>
