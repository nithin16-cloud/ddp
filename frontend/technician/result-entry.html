<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabLine — Technician Result Entry Workstation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-slate-50 text-slate-800 font-body min-h-screen flex flex-col">

  <!-- NAVBAR -->
  <header class="border-b border-slate-200 bg-white sticky top-0 z-30 shadow-xs">
    <div class="max-w-5xl mx-auto px-6 py-3.5 flex items-center justify-between">
      <a href="queue.html" class="flex items-center gap-2 text-slate-700 hover:text-slate-900 font-semibold text-xs">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 19l-7-7 7-7"/></svg>
        <span>Back to Specimen Queue</span>
      </a>

      <div class="flex items-center gap-2 text-xs font-mono text-slate-500">
        <span class="w-2 h-2 rounded-full bg-amber-600"></span>
        <span>Biological Interval Verification Active</span>
      </div>
    </div>
  </header>

  <!-- MAIN WORKSTATION -->
  <main class="max-w-5xl mx-auto px-6 py-6 flex-1 space-y-5">
    
    <!-- HEADER -->
    <div class="clinical-card p-5 bg-white flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <div class="flex items-center gap-2 mb-1">
          <span class="text-[10px] font-mono font-bold uppercase text-amber-800 bg-amber-50 px-2 py-0.5 rounded border border-amber-200" id="spec-tube">
            Serum &amp; EDTA
          </span>
          <span class="text-xs font-mono text-slate-400">Barcode: <strong id="spec-barcode" class="text-slate-800">BC89410982</strong></span>
        </div>
        <h1 class="font-display font-bold text-xl text-slate-900" id="spec-title">
          Result Entry: Nithin T (21y / Male)
        </h1>
        <p class="text-xs text-slate-500 mt-0.5" id="spec-meta">
          Order ID: LL-2026-8941 · Investigation Panels: CBC, Lipid Profile
        </p>
      </div>

      <div>
        <button onclick="prefillValues()" class="px-3.5 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold font-mono transition-colors">
          Auto-Fill Reference Values
        </button>
      </div>
    </div>

    <!-- ENTRY FORM -->
    <form id="entry-form" onsubmit="finalizeResults(event)" class="space-y-4">
      
      <div id="entry-sections-container" class="space-y-4">
        <!-- Dynamically rendered -->
      </div>

      <!-- NOTES -->
      <div class="clinical-card p-4 space-y-2 bg-white">
        <label class="block font-semibold text-xs text-slate-800">Technologist Clinical Remarks (Optional)</label>
        <textarea id="tech-notes" rows="2" placeholder="e.g. Sample analyzed on Beckman Coulter AU480 &amp; Sysmex XN-550. No hemolysis observed." class="w-full text-xs bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-slate-900 focus:bg-white"></textarea>
      </div>

      <!-- ACTION -->
      <div class="pt-2 flex flex-col sm:flex-row items-center justify-between gap-3">
        <p class="text-xs text-slate-400 font-mono text-[11px]">
          Status Flags: Normal (Green), Out-of-Range High (Amber), Deficient (Blue), Critical (Red)
        </p>

        <button type="submit" class="w-full sm:w-auto px-6 py-2.5 rounded-lg bg-amber-700 hover:bg-amber-800 text-white font-display font-semibold text-xs transition-colors shadow-2xs flex items-center justify-center gap-1.5">
          <span>Finalize &amp; Compile Official Report</span>
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
      </div>

    </form>

  </main>

  <script src="../js/shared.js"></script>
  <script>
    let activeOrder = null;
    let allTests = [];

    document.addEventListener('DOMContentLoaded', () => {
      allTests = LabStore.getTests();
      activeOrder = LabStore.getActiveOrder();

      if (!activeOrder) {
        window.location.href = 'queue.html';
        return;
      }

      document.getElementById('spec-barcode').textContent = activeOrder.sampleTubeBarcode || 'BC89410982';
      document.getElementById('spec-title').textContent = `Result Entry: ${activeOrder.patientName} (${activeOrder.patientAge || 21}y / ${activeOrder.patientGender || 'Male'})`;
      document.getElementById('spec-meta').textContent = `Order ID: ${activeOrder.id} · Panels: ${activeOrder.testNames.join(', ')}`;

      renderSections();
    });

    function renderSections() {
      const container = document.getElementById('entry-sections-container');
      container.innerHTML = '';

      const testObjects = activeOrder.testIds.map(id => allTests.find(t => t.id === id)).filter(Boolean);

      testObjects.forEach(t => {
        const card = document.createElement('div');
        card.className = 'clinical-card p-5 space-y-3 bg-white';

        let rows = '';
        if (t.parameters) {
          t.parameters.forEach(p => {
            const val = (activeOrder.results && activeOrder.results[p.key] !== undefined)
              ? activeOrder.results[p.key]
              : '';

            const evalRes = evaluateParameter(val, p.min, p.max);

            rows += `
              <div class="grid grid-cols-1 sm:grid-cols-12 gap-3 items-center py-2 border-b border-slate-100 last:border-0 text-xs">
                <div class="sm:col-span-5">
                  <span class="font-semibold text-slate-800 block">${p.label}</span>
                  <span class="text-[10px] font-mono text-slate-400">Biological Reference: ${p.min} - ${p.max} ${p.unit}</span>
                </div>

                <div class="sm:col-span-4 flex items-center gap-2">
                  <input type="number" step="any" required
                    id="input_${p.key}"
                    data-min="${p.min}"
                    data-max="${p.max}"
                    data-key="${p.key}"
                    value="${val}"
                    oninput="onParamInput(this)"
                    placeholder="Enter value"
                    class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 font-mono text-slate-900 font-bold focus:bg-white text-xs" />
                  <span class="font-mono text-[11px] text-slate-500 shrink-0 w-16">${p.unit}</span>
                </div>

                <div class="sm:col-span-3 text-right">
                  <span id="badge_${p.key}" class="badge-status ${evalRes.cssClass}">
                    ${evalRes.label}
                  </span>
                </div>
              </div>
            `;
          });
        }

        card.innerHTML = `
          <div class="pb-2 border-b border-slate-100 flex items-center justify-between">
            <h2 class="font-display font-bold text-sm text-slate-900">${t.name}</h2>
            <span class="text-[10px] font-mono text-slate-400">Tube: ${t.sampleType}</span>
          </div>
          <div class="space-y-1">
            ${rows}
          </div>
        `;

        container.appendChild(card);
      });
    }

    function onParamInput(el) {
      const min = parseFloat(el.dataset.min);
      const max = parseFloat(el.dataset.max);
      const key = el.dataset.key;
      const res = evaluateParameter(el.value, min, max);

      const b = document.getElementById(`badge_${key}`);
      if (b) {
        b.className = `badge-status ${res.cssClass}`;
        b.textContent = res.label;
      }
    }

    function prefillValues() {
      const inputs = document.querySelectorAll('input[id^="input_"]');
      inputs.forEach(input => {
        const key = input.dataset.key;
        allTests.forEach(t => {
          if (t.parameters) {
            const match = t.parameters.find(p => p.key === key);
            if (match) {
              input.value = match.defaultVal;
              onParamInput(input);
            }
          }
        });
      });
      showToast('Populated standard analyzer test results.', 'info');
    }

    function finalizeResults(e) {
      e.preventDefault();
      const inputs = document.querySelectorAll('input[id^="input_"]');
      const resultsObj = {};

      inputs.forEach(input => {
        resultsObj[input.dataset.key] = parseFloat(input.value);
      });

      activeOrder.results = resultsObj;
      activeOrder.currentStage = 'Report Generated';
      activeOrder.status = 'Report Generated';
      activeOrder.timestamps.completed = new Date().toLocaleTimeString();
      activeOrder.dietAdvice = generateDietAdviceForResults(resultsObj, activeOrder.testIds);

      LabStore.updateOrder(activeOrder);
      showToast('Results finalized. Medical report generated.', 'success');

      setTimeout(() => {
        window.location.href = '../patient/reports.html';
      }, 500);
    }
  </script>
</body>
</html>
