<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" class="labline-logo-mark" aria-hidden="true">
  <!-- Subtle Dimensional Ground Shadow -->
  <ellipse cx="24" cy="42" rx="14" ry="2.2" fill="var(--logo-shadow, rgba(15, 23, 42, 0.08))" />

  <!-- Layer 3: Folded Tracking Base (Dark Tone) -->
  <path d="M20 27H37C38.6569 27 40 28.3431 40 30V35C40 36.1046 39.1046 37 38 37H20V27Z" fill="var(--logo-dark, #0f766e)" />

