<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabLine — Healthcare Diagnostic Portal &amp; LIS</title>
  <meta name="description" content="Clinical diagnostic portal and specimen management platform featuring live tracking, automated flagging, and certified laboratory reports." />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <!-- Tailwind CSS Engine -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Design System -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-[#0a0e17] text-slate-100 font-body min-h-screen flex flex-col selection:bg-emerald-500 selection:text-slate-950">

  <!-- Header -->
  <header class="app-header">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      
      <a href="index.html" class="flex items-center gap-3 group focus:outline-none" aria-label="LabLine Homepage">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center text-slate-950 font-bold shadow-md shadow-emerald-500/20">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.5 3h15M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3M6 14h12M10 10l2 2 4-4"/>
          </svg>
        </div>
        <div>
          <span class="font-display font-extrabold text-xl text-white tracking-tight block leading-tight">LabLine</span>
          <span class="text-xs text-slate-400 block font-medium">Diagnostic Portal &amp; Specimen Management</span>
        </div>
      </a>

      <div class="flex items-center gap-2.5 text-xs font-mono text-slate-300 bg-slate-900/90 px-3.5 py-1.5 rounded-lg border border-slate-800 shadow-sm">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>REST API Active</span>
        <span class="text-slate-600">|</span>
        <span class="text-slate-400">ISO 15189:2022</span>
      </div>

    </div>
  </header>

  <!-- Main Login & Role Entry -->
  <main class="flex-1 flex items-center justify-center px-4 sm:px-6 py-12 w-full">
    
    <div class="w-full max-w-md space-y-6">
      
      <!-- Auth Card -->
      <div class="card p-8 shadow-xl bg-[#111726] border border-slate-800/80">
        
        <!-- Header -->
        <div class="text-center space-y-2 pb-6 border-b border-slate-800">
          <div class="w-12 h-12 mx-auto rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4.5 3h15M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3M6 14h12M10 10l2 2 4-4"/>
            </svg>
          </div>
          <h1 class="font-display font-extrabold text-2xl text-white tracking-tight" id="auth-title">Welcome to LabLine</h1>
          <p class="text-xs text-slate-400" id="auth-subtitle">Select your clinical role and sign in to your workspace</p>
        </div>

        <!-- Role Switcher -->
        <div class="tab-control mt-6" role="tablist" aria-label="Select User Role">
          <button type="button" role="tab" aria-selected="true" onclick="setRole('patient')" id="tab-patient" class="tab-control-btn active">
            Patient
          </button>
          <button type="button" role="tab" aria-selected="false" onclick="setRole('technician')" id="tab-technician" class="tab-control-btn">
            Technician
          </button>
          <button type="button" role="tab" aria-selected="false" onclick="setRole('admin')" id="tab-admin" class="tab-control-btn">
            Administrator
          </button>
        </div>

        <!-- Form -->
        <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4 mt-6">
          
          <div id="group-name" class="hidden form-group">
            <label for="input-name" class="form-label">Full Legal Name</label>
            <input type="text" id="input-name" placeholder="Enter your full name" class="form-input text-xs" autocomplete="name" />
          </div>

          <div class="form-group">
            <label for="input-email" class="form-label">Email Address</label>
            <input type="email" id="input-email" required placeholder="name@labline.com" class="form-input font-mono text-xs" autocomplete="email" />
          </div>

          <div class="form-group">
            <div class="flex justify-between items-center">
              <label for="input-password" class="form-label">Password</label>
              <button type="button" onclick="togglePassword()" class="text-xs text-emerald-400 hover:text-emerald-300 font-medium" id="btn-toggle-pw">
                Show
              </button>
            </div>
            <input type="password" id="input-password" required placeholder="••••••••" value="demo1234" class="form-input font-mono text-xs" autocomplete="current-password" />
          </div>

          <div class="flex items-center justify-between text-xs pt-1">
            <label class="flex items-center gap-2 text-slate-400 cursor-pointer select-none">
              <input type="checkbox" id="remember-me" checked class="w-4 h-4 rounded text-emerald-500 focus:ring-emerald-500 bg-slate-900 border-slate-700" />
              <span>Remember device</span>
            </label>
            <button type="button" onclick="showToast('Password reset instructions sent to your email.', 'info')" class="text-emerald-400 hover:text-emerald-300 transition-colors">
              Forgot password?
            </button>
          </div>

          <button type="submit" id="btn-submit" class="w-full btn btn-primary py-3 text-xs mt-3">
            <span id="btn-label">Sign In as Patient</span>
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
          </button>

          <div class="text-center pt-2">
            <button type="button" onclick="toggleAuthMode()" class="text-xs text-slate-400 hover:text-white transition-colors" id="btn-toggle-mode">
              Don't have an account? <span class="text-emerald-400 font-semibold">Create Account</span>
            </button>
          </div>
        </form>
      </div>

    </div>

  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800 bg-[#0a0e17] py-4 text-xs text-slate-400 font-mono mt-auto">
    <div class="max-w-6xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left">
      <div class="flex items-center gap-2">
        <span class="font-semibold text-white">LabLine Diagnostics</span>
        <span class="text-slate-600">·</span>
        <span>Clinical Pathology &amp; Specimen Tracking System</span>
      </div>
      <div>
        Accreditation: <span class="text-slate-300 font-medium">ISO 15189:2022 &amp; CAP Compliant</span>
      </div>
    </div>
  </footer>

  <!-- Notification Container -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="js/shared.js"></script>
  <script>
    let activeRole = 'patient';
    let authMode = 'login';

    const roleMap = {
      patient: {
        title: 'Patient',
        emailPlaceholder: 'rahul@labline.com',
        defaultName: 'Rahul Sharma',
        url: 'patient/catalog.html',
        btnClass: 'btn-primary'
      },
      technician: {
        title: 'Technician',
        emailPlaceholder: 'suresh@labline.com',
        defaultName: 'Suresh Kumar (Technologist)',
        url: 'technician/queue.html',
        btnClass: 'btn-tech'
      },
      admin: {
        title: 'Administrator',
        emailPlaceholder: 'admin@labline.com',
        defaultName: 'System Administrator',
        url: 'admin/dashboard.html',
        btnClass: 'btn-admin'
      }
    };

    function setRole(role) {
      activeRole = role;

      ['patient', 'technician', 'admin'].forEach(r => {
        const tab = document.getElementById(`tab-${r}`);
        if (r === role) {
          tab.classList.add('active');
          tab.setAttribute('aria-selected', 'true');
        } else {
          tab.classList.remove('active');
          tab.setAttribute('aria-selected', 'false');
        }
      });

      const info = roleMap[role];
      const emailInput = document.getElementById('input-email');
      emailInput.placeholder = info.emailPlaceholder;
      if (!emailInput.value || Object.values(roleMap).some(rm => rm.emailPlaceholder === emailInput.value)) {
        emailInput.value = info.emailPlaceholder;
      }

      const btn = document.getElementById('btn-submit');
      btn.className = `w-full btn ${info.btnClass} py-3 text-xs mt-3`;

      updateSubmitText();
    }

    function updateSubmitText() {
      const label = document.getElementById('btn-label');
      const action = authMode === 'login' ? 'Sign In' : 'Create Account';
      label.textContent = `${action} as ${roleMap[activeRole].title}`;
    }

    function toggleAuthMode() {
      const groupName = document.getElementById('group-name');
      const toggleBtn = document.getElementById('btn-toggle-mode');
      const title = document.getElementById('auth-title');
      const subtitle = document.getElementById('auth-subtitle');

      if (authMode === 'login') {
        authMode = 'register';
        groupName.classList.remove('hidden');
        title.textContent = 'Create LabLine Account';
        subtitle.textContent = 'Register your diagnostic profile to schedule tests and access reports';
        toggleBtn.innerHTML = 'Already registered? <span class="text-emerald-400 font-bold">Sign In</span>';
      } else {
        authMode = 'login';
        groupName.classList.add('hidden');
        title.textContent = 'Welcome to LabLine';
        subtitle.textContent = 'Select your clinical role and sign in to your workspace';
        toggleBtn.innerHTML = 'Don\'t have an account? <span class="text-emerald-400 font-bold">Create Account</span>';
      }
      updateSubmitText();
    }

    function togglePassword() {
      const pwInput = document.getElementById('input-password');
      const btn = document.getElementById('btn-toggle-pw');
      if (pwInput.type === 'password') {
        pwInput.type = 'text';
        btn.textContent = 'Hide';
      } else {
        pwInput.type = 'password';
        btn.textContent = 'Show';
      }
    }

    function handleAuth(e) {
      if (e && e.preventDefault) e.preventDefault();
      
      const email = document.getElementById('input-email').value.trim();
      const password = document.getElementById('input-password').value;
      const customName = document.getElementById('input-name').value.trim();

      if (!email || !password) {
        showToast('Please enter your email and password.', 'warning');
        return;
      }

      const userName = customName || (email.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, l => l.toUpperCase())) || roleMap[activeRole].defaultName;

      LabStore.setCurrentUser({
        name: userName,
        email: email,
        role: activeRole,
        token: `jwt_${activeRole}_${Date.now()}`
      });

      showToast(`Authenticated as ${roleMap[activeRole].title}. Loading workspace...`, 'success');
      setTimeout(() => {
        window.location.href = roleMap[activeRole].url;
      }, 300);
    }

    document.addEventListener('DOMContentLoaded', () => {
      setRole('patient');
    });
  </script>
</body>
</html>
