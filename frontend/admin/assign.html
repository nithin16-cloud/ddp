<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LabLine — Assignments</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg:#F5F7F7; --ink:#12232E; --teal:#0E8478; --teal-light:#39A99C;
    --amber:#D98A2B; --line:#D7DEDE; --paper-tint:#EDF2F1;
  }
  *{box-sizing:border-box;}
  body{ background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; }
  .font-display{font-family:'Space Grotesk',sans-serif;}
  .font-mono{font-family:'IBM Plex Mono',monospace;}
  a:focus-visible, button:focus-visible, select:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }

  .card{ border:1px solid var(--line); background:#fff; }
  .field-select{ border:1px solid var(--line); background:#fff; }
  .field-select:focus{ border-color:var(--teal); }

  .status-chip{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.04em;
    padding:2px 8px; border-radius:999px; white-space:nowrap;
  }
  .status-unassigned{ background:#FBEDE4; color:var(--amber); }
  .status-assigned{ background:var(--paper-tint); color:var(--teal); }
</style>
</head>
<body class="min-h-screen">

<header class="border-b border-slate-200 bg-white sticky top-0 z-20">
  <div class="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <svg width="20" height="20" viewBox="0 0 22 22" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="20" height="20" rx="4" stroke="#0E8478" stroke-width="1.6"/>
        <path d="M6 11h3l1.5-4 2 8 1.5-4h3" stroke="#0E8478" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="font-display font-semibold">LabLine</span>
      <span class="font-mono text-[10px] text-slate-400 ml-1 border border-slate-200 rounded px-1.5 py-0.5">ADMIN</span>
    </div>
    <nav class="hidden sm:flex items-center gap-6 text-sm text-slate-500">
      <a href="dashboard.html" class="hover:text-slate-800">Dashboard</a>
      <a href="catalog-manage.html" class="hover:text-slate-800">Catalog</a>
      <a href="assign.html" class="text-[--ink] font-medium" style="color:var(--ink)">Assignments</a>
      <a href="../index.html" class="hover:text-slate-800">Sign out</a>
    </nav>
  </div>
</header>

<main class="max-w-4xl mx-auto px-6 py-10">
  <h1 class="font-display font-semibold text-2xl mb-1">Home pickup assignments</h1>
  <p class="text-sm text-slate-500 mb-8">Assign a phlebotomist to each pending home pickup request.</p>

  <div id="requests-list" class="space-y-3"></div>
</main>

<script>
  const PHLEBOTOMISTS = ['Unassigned', 'Deepak R.', 'Priya S.', 'Manjunath K.', 'Ayesha F.'];

  let requests = [
    { id:'LBX-2026-71042', patient:'Ramesh Iyer',    address:'HSR Layout, Bengaluru', slot:'Today, 9:00 AM',  assigned:'Unassigned' },
    { id:'LBX-2026-71039', patient:'Fathima Noor',   address:'Indiranagar, Bengaluru', slot:'Today, 10:30 AM', assigned:'Priya S.' },
    { id:'LBX-2026-71028', patient:'Sneha Kulkarni', address:'Jayanagar, Bengaluru',   slot:'Today, 11:00 AM', assigned:'Unassigned' },
    { id:'LBX-2026-71019', patient:'Manoj Pillai',   address:'Whitefield, Bengaluru',  slot:'Tomorrow, 8:00 AM', assigned:'Unassigned' },
  ];

  function render(){
    const list = document.getElementById('requests-list');
    list.innerHTML = requests.map(r => `
      <div class="card rounded-lg p-4 flex items-center justify-between gap-4 flex-wrap">
        <div>
          <div class="flex items-center gap-2 mb-1">
            <span class="font-mono text-xs text-slate-400">${r.id}</span>
            <span class="status-chip ${r.assigned === 'Unassigned' ? 'status-unassigned' : 'status-assigned'}">
              ${r.assigned === 'Unassigned' ? 'UNASSIGNED' : 'ASSIGNED'}
            </span>
          </div>
          <p class="text-sm font-medium">${r.patient}</p>
          <p class="text-xs text-slate-400">${r.address} · ${r.slot}</p>
        </div>
        <div class="flex items-center gap-2">
          <label for="assign-${r.id}" class="sr-only">Assign phlebotomist for ${r.id}</label>
          <select id="assign-${r.id}" data-id="${r.id}" class="field-select rounded-md px-3 py-2 text-sm outline-none">
            ${PHLEBOTOMISTS.map(p => `<option value="${p}" ${p === r.assigned ? 'selected' : ''}>${p}</option>`).join('')}
          </select>
        </div>
      </div>
    `).join('');

    list.querySelectorAll('select').forEach(sel => {
      sel.addEventListener('change', () => {
        const req = requests.find(r => r.id === sel.dataset.id);
        req.assigned = sel.value;
        render();
      });
    });
  }

  render();
</script>

</body>
</html>
